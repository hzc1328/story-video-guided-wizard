name: Release skill package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check scripts tests
      - run: python -m unittest discover -s tests -q
      - run: python scripts/gendocs.py --check
      - name: Zip skill package
        run: |
          NAME=story-video-guided-wizard-${{ github.ref_name }}
          mkdir "$NAME"
          cp -r SKILL.md SKILL.en.md README.md README.en.md LICENSE scripts assets references docs "$NAME"/
          zip -r "$NAME.zip" "$NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: story-video-guided-wizard-${{ github.ref_name }}.zip
