<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>故事采集卡</title>

<style>
:root{
  --paper:#F2F2F4; --panel:#FFFFFF; --ink:#1E2333; --ink-2:#5B6275; --ink-3:#8A90A3;
  --line:#D9DBE3; --line-2:#EBECF1;
  --lamp:#C4892C; --lamp-ink:#8A5E14; --lamp-soft:#F7ECD8;
  --focus:#3B5A85; --shadow:0 1px 2px rgba(30,35,51,.06),0 8px 24px rgba(30,35,51,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15181F; --panel:#1D2129; --ink:#ECEDF1; --ink-2:#A6ABBA; --ink-3:#737A8E;
    --line:#2F3442; --line-2:#262A36;
    --lamp:#D9A24A; --lamp-ink:#EAC275; --lamp-soft:#2B2517;
    --focus:#8FB0E0; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#15181F; --panel:#1D2129; --ink:#ECEDF1; --ink-2:#A6ABBA; --ink-3:#737A8E;
  --line:#2F3442; --line-2:#262A36;
  --lamp:#D9A24A; --lamp-ink:#EAC275; --lamp-soft:#2B2517;
  --focus:#8FB0E0; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;font-weight:600;margin:0;text-wrap:balance}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}

.bar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar h1{font-size:17px;letter-spacing:.02em}
.bar .sp{flex:1}
.prog{display:inline-flex;align-items:center;gap:10px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink-2);background:var(--panel)}
.prog .track{width:72px;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.prog .fill{height:100%;width:0;background:var(--lamp);transition:width .2s}
.prog.done{border-color:var(--lamp);color:var(--lamp-ink);background:var(--lamp-soft)}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:#1E2333;font-weight:500}
.btn.primary:hover{filter:brightness(.95)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 96px;display:grid;grid-template-columns:minmax(0,1fr);gap:40px}
@media (min-width:1000px){.wrap{grid-template-columns:minmax(0,640px) 360px;align-items:start}}
.intro h2{font-size:28px;line-height:1.3;margin-bottom:10px}
.intro p{margin:0;color:var(--ink-2);max-width:36em}
.intro .rule{display:flex;gap:18px;margin-top:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.intro .rule b{color:var(--ink);font-weight:500}

section{padding:28px 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:0;padding-top:0}
.eyebrow{display:flex;align-items:baseline;gap:12px;font-size:12px;letter-spacing:.08em;color:var(--ink-3)}
.eyebrow .tc{color:var(--lamp-ink);letter-spacing:.02em}
section h2{font-size:24px;margin-top:6px}
section h2 small{font-family:"Noto Sans SC","PingFang SC",sans-serif;font-weight:400;font-size:15px;color:var(--ink-2);margin-left:10px}
.why{margin:8px 0 0;color:var(--ink-2);font-size:13.5px;max-width:36em}

.q{margin-top:22px}
.q-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.q-n{font-size:12px;color:var(--ink-3);min-width:1.6em}
.q-t{font-weight:500}
.q-k{font-size:12px;padding:1px 8px;border-radius:999px;color:var(--ink-3);background:var(--line-2)}
.q-k.rec{color:var(--lamp-ink);background:var(--lamp-soft)}
.q-sub{font-size:13px;color:var(--ink-2);margin:-6px 0 10px 2.2em}
.hint{font-size:12.5px;color:var(--ink-3);margin:8px 0 0 2.2em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-left:2.2em}
.chip{position:relative}
.chip input[type=radio]{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chip label{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;font-size:14px;line-height:1.35;transition:border-color .12s,background .12s}
.chip label:hover{border-color:var(--ink-3)}
.chip input:checked+label{border-color:var(--lamp);background:var(--lamp-soft);color:var(--lamp-ink);font-weight:500}
.chip input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.chip.other{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip.other input[type=text]{width:240px;display:none;padding:6px 10px;font-size:13.5px}
.chip.other input:checked~input[type=text]{display:block}
.sub{margin:12px 0 0 2.2em;padding:12px 14px;border:1px dashed var(--line);border-radius:8px}
.sub .q-h{margin-bottom:8px}
.sub .chips{margin-left:0}
input[type=text],textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px}
input[type=text]::placeholder,textarea::placeholder{color:var(--ink-3)}
textarea{min-height:64px;resize:vertical}
.row{display:grid;gap:10px;margin-left:2.2em}
.row.two{grid-template-columns:1fr 1fr}
.field{display:grid;gap:4px}
.field label{font-size:12.5px;color:var(--ink-2)}
.checks{display:grid;gap:8px;margin-left:2.2em}
.check{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.check label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input[type=checkbox]{width:16px;height:16px;accent-color:var(--lamp);margin:0}
.check input[type=text]{padding:6px 10px;font-size:13.5px}

.card{position:sticky;top:64px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.card-h{padding:14px 16px 12px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:16px}
.card-h p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2)}
.acts-chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.act{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);background:var(--paper)}
.act.on{border-color:var(--lamp);color:var(--lamp-ink);background:var(--lamp-soft)}
.card-b{padding:14px 16px;font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-all}
.card-b .m{color:var(--ink-3)}
.card-b .u{color:var(--lamp-ink);background:var(--lamp-soft);padding:0 4px;border-radius:3px}
.card-f{padding:12px 16px;border-top:1px solid var(--line-2);display:grid;gap:10px}
.card-f .btns{display:flex;gap:8px;flex-wrap:wrap}
.card-f .tip{font-size:12px;color:var(--ink-3)}
.card-f .state{font-size:12.5px;color:var(--lamp-ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:20;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:600px){.row.two{grid-template-columns:1fr}.bar-in{padding:10px 16px}.wrap{padding:24px 16px 80px}.intro h2{font-size:24px}.chip.other input[type=text]{width:100%}}
@media (max-width:600px){input[type=text],textarea{font-size:16px}.bar .prog{order:3;width:100%;justify-content:center}}
html[lang="en"] .card-b{word-break:normal;overflow-wrap:anywhere}
#langToggle{text-decoration:none;color:var(--ink)}
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <h1 id="appTitle">故事采集卡</h1>
  <span class="sp"></span>
  <a class="btn" id="langToggle" href="?lang=en" aria-label="Switch language">English</a>
  <span class="prog" id="prog"><span class="track"><span class="fill" id="fill"></span></span><span id="progt" aria-live="polite">必答 0 / 1</span></span>
  <button class="btn" id="btnClear" type="button">清空</button>
</div></div>

<div class="wrap">
<main>
  <div class="intro"><p>填好后点「复制故事卡」，通过微信等方式发回制作方。推荐电脑填写，手机也可以。下面的例子只是填写提示，请只写真实经历；没有、记不清或不想呈现的，选「其他」并说明，细节栏也可如实填写。文案、图片和视频由制作方用 AI 工具完成，这张卡只负责把故事讲清楚。</p><p>文字草稿仅保存在当前浏览器；不收集手机号，不向后台提交。照片原图请在聊天中另发。</p></div>

  <section id="sTheme">
    <div class="eyebrow"><span>第一步</span></div>
    <h2>这部片子讲谁的故事<small>先选题材，问题会按题材生成</small></h2>
    <div class="q">
      <div class="q-h"><span class="q-n">1</span><span class="q-t">题材</span></div>
      <div class="chips" id="theme"></div>
    </div>
  </section>

  <div id="themeBody" hidden></div>
</main>

<aside>
  <div class="card" role="region" aria-labelledby="cardTitle">
    <div class="card-h">
      <h3 id="cardTitle">故事卡</h3>
      <p>答一题，改一行。填完后复制，通过微信发回制作方。</p>
      <div class="acts-chips" id="actChips"></div>
    </div>
    <div class="card-b mono" id="cardBody"></div>
    <div class="card-f">
      <div class="btns">
        <button class="btn primary" id="btnCopy" type="button">复制故事卡</button>
      </div>
      <textarea id="copyFallback" aria-label="完整故事卡，可长按全选复制" readonly hidden></textarea>
      <div class="tip" id="submitTip">复制后把故事卡和原图一起发给制作方。</div>
    </div>
  </div>
</aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
/* ============ 数据：公共项 ============ */
const COMMON = {
  ratio:[['宽屏 16:9（默认，现场大屏）','宽屏 16:9'],['窄屏 9:16（手机竖屏）','窄屏 9:16']],
  duration:[['90 秒（默认）','90 秒'],['180 秒','180 秒']],
  style:[['写实电影感','写实电影感'],['水彩绘本','水彩绘本'],['纸艺折纸','纸艺折纸'],['黏土定格','黏土定格'],['可爱 3D 动画','可爱 3D 动画']],
  styleMode:[['真人出镜，环境和画风是动画','真人出镜+动画环境'],['纯动画，主角也画成动画形象','纯动画'],['写实真人，不是动画','写实真人']],
  adds:[['pet','宠物，名字','例：柯基「豆豆」，会转圈圈欢迎你回家'],['place','一个有意义的地方','例：学校后门的奶茶店，第一杯都是在那儿喝的'],['thing','一件有意义的物品','例：第一次约会的电影票，一直夹在书里'],['song','一首歌','例：他们大学时常听的那首，一响就想起对方'],['phrase','一句常说的话','例：走啦，回家——最普通也最安心的一句'],['joke','一个只有你们懂的梗 / 暗号','例：说"老地方见"就都懂了']]
};
const PHOTO_COUPLE='请把两人清晰的正脸合照或各自单人照，通过微信等方式另发给制作方。早年的照片也可以补充。此处不上传照片。';
const HINT_SELFIE='自拍是广角近距离，脸会比真人略宽，生成的画面会照着画。能再给一张别人拍的合照更好。';
const OCC_SUB='决定结尾旁白怎么落、配乐快慢。';
const SAY_SUB='想对 TA 说的一句话，会做结尾旁白。';
const MEET_OPTS=['校园同学','同事','朋友介绍','网络认识','旅行或活动偶遇','青梅竹马','邻居','共同的爱好圈子'];
const MEET_FILL={ask:'第一次见面在哪、什么季节、谁先注意到谁？慢慢想，那个画面会自己浮上来。',ph:'例：大二图书馆门口的林荫道，秋天，他隔着人群先看见了她'};
const MEET_EXTRA={ask:'那天有没有一个你到现在还记得的小东西（一本书、一杯饮料、一句话）？它是故事的第一个信物。',ph:'例：她抱着两本书，其中一本到现在还放在他书架最上面'};
const CLOSE_OPTS=['雨天共伞','一起自习或加班','一起吃饭','深夜打电话','一起旅行','生病照顾','一起做饭','一起养宠物','一句只有你们懂的玩笑'];
const CLOSE_FILL={ask:'对方做过的一件让你心动的小事，那种"就是 TA 了"的瞬间。',ph:'例：下雨天他的伞永远偏向她，自己右肩总是湿的'};
const WHO_COUPLE={ask:'两人在视频里怎么称呼',a:'我',b:'TA',aph:'例：阿远',bph:'例：小雨'};

/* ============ 数据：12 个题材 ============ */
const THEMES = {
wedding:{
  t:'婚礼爱情',title:'婚礼故事采集卡',
  who:{ask:'两人在视频里怎么称呼',a:'新郎',b:'新娘',aph:'例：阿远',bph:'例：小雨'},
  photo:'请把两人清晰的正脸合照或各自单人照，通过微信等方式另发给制作方。刚认识时、婚纱或试妆的照片也可以补充。此处不上传照片。',
  photoHint:HINT_SELFIE,
  occ:{ask:'在哪个环节播放',sub:'决定结尾旁白怎么落、配乐快慢：暖场留一步给仪式，仪式中直接落到誓言，宴会开场更轻快、可以带一句给来宾。',opts:['仪式前暖场','仪式中','宴会开场']},
  acts:[
    {n:'第一幕',name:'相识',ask:'你们是怎么认识的',opts:MEET_OPTS,fill:MEET_FILL,extra:MEET_EXTRA},
    {n:'第二幕',name:'相知',ask:'是怎么慢慢走近的',opts:CLOSE_OPTS,fill:CLOSE_FILL},
    {n:'第三幕',name:'确认',ask:'怎么在一起的，表白或求婚',opts:['毕业时决定一起走','表白','求婚','异地重逢','决定同行（搬家、换城市）','先做了很久朋友，顺其自然在一起','一方默默喜欢了很多年'],fill:{ask:'在哪、谁开的口、说了什么？那一刻的天气或气味，还记得吗？',ph:'例：毕业那天教学楼前，他说以后的路一起走，太阳正好'}},
    {n:'第四幕',name:'相伴',ask:'一起生活的日子',opts:['家中翻相册','布置第一个家','养宠物','一起做饭','异地坚持','共同事业','一起熬过一件难事','一起追一部剧追到结局','每年生日雷打不动的惊喜'],fill:{ask:'日常里最"你们"的一个画面，一个能反复回看的瞬间。',ph:'例：周末傍晚窝在沙发翻老照片，笑到茶都凉了'}},
    {n:'第五幕',name:'承诺',ask:'婚礼当天，片子怎么收尾',venue:{ask:'婚礼在哪办',opts:['户外草坪或花园','室内宴会厅','中式庭院','教堂','海边','旅行婚礼','山顶','老房子 / 故居']},opts:['牵手走远','回眸相笑','拥抱','交换戒指（只拍手，最稳）','额头相抵','并肩看向台下的亲人'],fill:{ask:SAY_SUB,ph:'例：这次，我就在你身边，以后也是'}}
  ]},
proposal:{
  t:'求婚',title:'求婚故事采集卡',
  who:WHO_COUPLE,photo:PHOTO_COUPLE,photoHint:HINT_SELFIE,
  occ:{ask:'片子什么时候用',sub:'求婚前预热吊胃口，现场播放直接落到那句话，事后回顾更松弛。'+OCC_SUB,opts:['求婚前预热','求婚现场播放','求婚后回顾']},
  acts:[
    {n:'第一幕',name:'相识',ask:'你们是怎么认识的',opts:MEET_OPTS,fill:MEET_FILL,extra:MEET_EXTRA},
    {n:'第二幕',name:'相知',ask:'是怎么慢慢走近的',opts:CLOSE_OPTS,fill:CLOSE_FILL},
    {n:'第三幕',name:'认定',ask:'怎么确定就是 TA',opts:['一次深夜长谈','一起熬过难关','见过彼此最狼狈的样子','说不上来，就是确定','TA 把你随口一提的事记了好久','和 TA 在一起，你可以安心做自己'],fill:{ask:'哪个瞬间让你确定要向 TA 求婚？',ph:'例：她照顾生病的我一周，我就想是这个人了'}},
    {n:'第四幕',name:'筹划',ask:'求婚是怎么准备的',opts:['准备戒指','布置场地','朋友助攻','瞒着 TA 保密','练习了好几遍要说的话','请 TA 最重视的人到场见证'],fill:{ask:'筹划中最用心或最惊险的一个细节，后来 TA 知道了吗。',ph:'例：戒指藏在蛋糕里，差点被她先吃到'}},
    {n:'第五幕',name:'那一刻',ask:'求婚那一刻',venue:{ask:'求婚在哪里（或打算在哪里）',opts:['户外','餐厅','家里','旅行中','第一次约会的地方','一间有特殊意义的餐厅','两人常去的江边 / 海边']},opts:['单膝跪地','拿出戒指','说出那句话','TA 哭了','两个人哭成一团','TA 说"我愿意"'],fill:{ask:SAY_SUB,ph:'例：往后的路，换我牵着你走'}}
  ]},
anniversary:{
  t:'纪念日 / 周年',title:'纪念日故事采集卡',
  who:WHO_COUPLE,photo:PHOTO_COUPLE,photoHint:HINT_SELFIE,
  occ:{ask:'片子什么时候看',sub:OCC_SUB,opts:['纪念日当晚','聚会播放','私下两人看']},
  acts:[
    {n:'第一幕',name:'初见',ask:'你们是怎么认识的',opts:MEET_OPTS,fill:MEET_FILL,extra:MEET_EXTRA},
    {n:'第二幕',name:'同行',ask:'是怎么慢慢走近的',opts:CLOSE_OPTS,fill:CLOSE_FILL},

  "例：走啦，回家——最普通也最安心的一句": "e.g. \"Come on, let's go home\"—the most ordinary yet reassuring line",
  "例：说\"老地方见\"就都懂了": "e.g. Say \"meet at the old place\" and you both understand"
};
const tr = text => LANG==='en' ? (EN[text] ?? text) : text;
const comma=LANG==='en'?', ':'、';

/* ============ 渲染 ============ */
let themeKey=null;   // 当前题材
function chips(host, name, opts, otherPh){
  const h = typeof host==='string' ? $(host) : host;
  let html = opts.map((o,i)=>{ const [label,val] = Array.isArray(o)?o:[o,o];
    return `<span class="chip"><input type="radio" name="${name}" id="${name}_${i}" value="${esc(val)}"><label for="${name}_${i}">${esc(label)}</label></span>`; }).join('');
  html += `<span class="chip other"><input type="radio" name="${name}" id="${name}_x" value="其他"><label for="${name}_x">其他</label><input type="text" id="${name}_other" placeholder="${esc(otherPh||'自己写一个')}" aria-label="其他，请填写"></span>`;
  h.innerHTML = html;
}
function setRadio(name,val){ const r=document.querySelector(`input[name="${name}"][value="${val}"]`); if(r) r.checked=true; }

/* 题材 chips */
chips('#theme','theme',THEME_KEYS.map(k=>[THEMES[k].t,k]));
document.querySelector('#theme .chip.other').remove();   // 题材不提供"其他"

let qno=0;
function renderTheme(key){
  themeKey=key; const T=THEMES[key]; qno=0;
  document.title=T.title; $('#appTitle').textContent=T.title;
  const q=(inner)=>{qno++;return `<span class="q-n">${qno}</span>`+inner;};
  let h=`
  <section id="s0">
    <div class="eyebrow"><span>基本信息</span></div>
    <h2>先认识一下<small>全部必答</small></h2>
    <div class="q"><div class="q-h">${q('<span class="q-t">视频尺寸</span>')}</div><div class="chips" id="ratio"></div></div>
    <div class="q"><div class="q-h">${q(`<span class="q-t">${T.who.ask}</span>`)}</div>
      <div class="row two">
        <div class="field"><label for="whoA">${esc(T.who.a)}</label><input type="text" id="whoA" placeholder="${esc(T.who.aph)}"></div>
        <div class="field"><label for="whoB">${esc(T.who.b)}</label><input type="text" id="whoB" placeholder="${esc(T.who.bph)}"></div>
      </div></div>
    <div class="q"><div class="q-h">${q('<span class="q-t">照片</span>')}</div>
      <div class="row"><p class="why">${esc(T.photo)}</p></div>
      <div class="hint">${esc(T.photoHint)}</div></div>
    <div class="q"><div class="q-h">${q(`<span class="q-t">${T.occ.ask}</span>`)}</div>
      <div class="q-sub">${esc(T.occ.sub)}</div>
      <div class="chips" id="occasion"></div></div>
    <div class="q"><div class="q-h">${q('<span class="q-t">时长</span>')}</div>
      <div class="q-sub">先选希望的片长，五幕按故事轻重分配；具体镜头根据后续旁白的实际节奏安排。</div>
      <div class="chips" id="duration"></div></div>
    <div class="q"><div class="q-h">${q('<span class="q-t">画风</span>')}</div>
      <div class="chips" id="style"></div>
      <div class="sub" id="styleSub" hidden>
        <div class="q-h"><span class="q-t">这个画风里，主角怎么出现</span></div>
        <div class="chips" id="styleMode"></div>
        <div class="hint" style="margin-left:0">"真人出镜"：脸和身材按照片来，环境和质感是动画；"纯动画"：主角也画成动画形象；画风选了"其他"且是写实的，选"写实真人"。这一项直接决定生图提示词怎么写。</div>
      </div></div>
  </section>
  <div id="acts"></div>
  <section id="s6">
    <div class="eyebrow"><span>加减项</span></div>
    <h2>想加的，不想要的<small>选填，建议填</small></h2>
    <p class="why">这里的东西会直接变成画面里的道具、地点和旁白里的一句话，是片子最像"你们"的部分。</p>
    <div class="q"><div class="q-h">${q('<span class="q-t">想放进去的东西</span>')}<span class="q-k rec">建议填</span></div>
      <div class="checks" id="adds"></div></div>
    <div class="q"><div class="q-h">${q('<span class="q-t">不想出现的东西</span>')}<span class="q-k rec">建议填</span></div>
      <div class="row"><textarea id="avoid" placeholder="例：不出现前任、不出现酒"></textarea></div></div>
    <div class="q"><div class="q-h">${q('<span class="q-t">五幕里有没有想换掉的一幕，换成什么</span>')}<span class="q-k">选填</span></div>
      <div class="row"><input type="text" id="swap" placeholder="例：第四幕换成和爸妈一起过年" ></div></div>
  </section>
  <section id="s7">
    <div class="eyebrow"><span>音乐</span></div>
    <h2>配乐<small>选填，只收不带歌词的纯音乐</small></h2>
    <div class="q"><div class="q-h">${q('<span class="q-t">有没有想用的纯音乐</span>')}</div>
      <div class="chips" id="music"></div>
      <div class="hint">带歌词的歌和旁白会打架，所以只收纯音乐。没有合适的，制作方用音乐模型按片子情绪定制一首。</div></div>
  </section>
  <section id="s8">
    <div class="eyebrow"><span>备注</span></div>
    <h2>还有什么想法<small>必答，任何想法都写这里</small></h2>
    <div class="q"><div class="q-h">${q('<span class="q-t">注意点、参考、想法</span>')}</div>
      <div class="q-sub">想要的画面质感、参考的电影或照片、特别在意的地方、怕出错的地方，都写。写得越具体，片子越像你们想的那样。</div>
      <div class="row"><textarea id="notes" placeholder="例：画面想要日系电影那种朦胧、精致的质感；旁白别太煽情；他不喜欢正面特写"></textarea></div></div>
  </section>`;
  $('#themeBody').innerHTML=h;
  chips('#ratio','ratio',COMMON.ratio,'例：1:1 方形');
  chips('#occasion','occasion',T.occ.opts,'自己写一个');
  chips('#duration','duration',COMMON.duration,'例：120 秒');
  chips('#style','style',COMMON.style,'例：岩井俊二《花与爱丽丝》那种质感');
  chips('#styleMode','styleMode',COMMON.styleMode,'自己写');
  $('#music').innerHTML = `<span class="chip other"><input type="radio" name="music" id="music_own" value="自带"><label for="music_own">我有想用的纯音乐</label><input type="text" id="music_own_t" placeholder="曲名 / 作者 / 链接，不带歌词" aria-label="曲名"></span><span class="chip"><input type="radio" name="music" id="music_us" value="制作方定制"><label for="music_us">交给制作方定制</label></span>`;
  $('#acts').innerHTML = T.acts.map((a,i)=>{const id='a'+(i+1);return `
  <section id="${id}">
    <div class="eyebrow"><span>${a.n}</span></div>
    <h2>${a.name}<small>${a.ask}</small></h2>
    ${a.venue?`<div class="q">
      <div class="q-h">${q(`<span class="q-t">${a.venue.ask}</span>`)}</div>
      <div class="chips" id="${id}_venue_chips"></div>
    </div>`:''}
    <div class="q">
      <div class="q-h">${q(`<span class="q-t">${a.venue?'结尾动作':'选一个'}</span>`)}</div>
      <div class="chips" id="${id}_chips"></div>
    </div>
    <div class="q">
      <div class="q-h">${q('<span class="q-t">填一个</span>')}</div>
      <div class="q-sub">${esc(a.fill.ask)}</div>
      <div class="row"><input type="text" id="${id}_fill" placeholder="${esc(a.fill.ph)}"></div>
    </div>
    ${a.extra?`<div class="q">
      <div class="q-h">${q('<span class="q-t">加一个</span>')}<span class="q-k">选填</span></div>
      <div class="q-sub">${esc(a.extra.ask)}</div>
      <div class="row"><input type="text" id="${id}_extra" placeholder="${esc(a.extra.ph)}"></div>
    </div>`:''}
  </section>`;}).join('');
  T.acts.forEach((a,i)=>{const id='a'+(i+1);chips('#'+id+'_chips', id+'_pick', a.opts, '写一个场景'); if(a.venue) chips('#'+id+'_venue_chips', id+'_venue', a.venue.opts, '例：民宿院子');});
  $('#adds').innerHTML = COMMON.adds.map(([k,label,ph])=>`
  <div class="check"><label><input type="checkbox" id="add_${k}">${esc(label)}</label><input type="text" id="add_${k}_t" placeholder="${esc(ph)}" aria-label="${esc(label)}"></div>`).join('');
  $('#actChips').innerHTML = T.acts.map((a,i)=>`<span class="act" id="ac_a${i+1}">${a.name}</span>`).join('');
  /* 单选 chips 组语义：label 取自所属小题的 .q-t 文本；在 translateStatic() 前设置以随界面语言翻译 */
  document.querySelectorAll('.chips').forEach(c=>{
    const host=c.closest('.sub')||c.closest('.q');
    const t=host&&host.querySelector('.q-t');
    c.setAttribute('role','radiogroup');
    if(t)c.setAttribute('aria-label',t.textContent.trim());
  });
  setRadio('ratio','宽屏 16:9');setRadio('duration','90 秒');
  $('#themeBody').hidden=false;
}

/* ============ 状态与故事卡 ============ */
const v = id => { const el = document.getElementById(id); return el ? (el.type==='checkbox' ? el.checked : el.value.trim()) : ''; };
const radio = name => { const r = document.querySelector(`input[name="${name}"]:checked`); return r ? r.value : ''; };
function pick(name){ const r = radio(name); if(r==='其他'){ const t = v(name+'_other'); return t ? tr('其他')+': '+t : ''; } return tr(r); }
const needMode = () => { const r = radio('style'); return !!r && r!=='写实电影感'; };

function build(){
  const U='<span class="u">'+tr('未填')+'</span>', need=[],html=[],text=[];
  const colon=LANG==='en'?': ':'：';
  const L=(h,t)=>{html.push(h);text.push(t);};
  const cell=(val,label)=>{if(val)return [esc(val),val];need.push(tr(label));return [U,tr('未填')];};
  if(!themeKey){
    need.push(tr('题材'));
    L(tr('题材')+colon+U,tr('题材')+colon+tr('未填'));
    L('<span class="m">'+tr('先选题材')+'</span>',tr('先选题材'));
    finishBuild(1,need,html,text);return;
  }
  const T=THEMES[themeKey];
  $('#styleSub').hidden=!needMode();
  const rows=[['题材',tr(T.t)],['称呼',v('whoA')&&v('whoB')?v('whoA')+' / '+v('whoB'):''],['尺寸',pick('ratio')],['场合',pick('occasion')],['时长',pick('duration')]];
  let sty=pick('style');
  if(sty&&needMode()){const mode=pick('styleMode');if(!mode)need.push(tr('画风里主角怎么出现'));sty+=' · '+(mode||tr('未填'));}
  rows.push(['画风',sty]);
  const parts=rows.map(([label,value])=>{const [h,t]=cell(value,label);return [tr(label)+colon+h,tr(label)+colon+t];});
  L(parts.map(x=>x[0]).join('　　'),parts.map(x=>x[1]).join('　　'));
  L(tr('照片：原图通过聊天另发，不包含在复制文字中'),tr('照片：原图通过聊天另发，不包含在复制文字中'));
  T.acts.forEach((a,i)=>{
    const id='a'+(i+1);
    const p=pick(id+'_pick'),f=v(id+'_fill');
    const prefix=tr(a.n)+(LANG==='en'?' ':'');
    const [pH,pT]=cell(p,prefix+tr(a.venue?'结尾动作':'场景'));
    const [fH,fT]=cell(f,prefix+tr(a.venue?'结尾一句':'细节'));
    let h=tr(a.n)+' '+tr(a.name)+colon,t=h;
    if(a.venue){const [vH,vT]=cell(pick(id+'_venue'),prefix+tr('场地'));h+=vH+' ｜ '+pH+' ｜ '+tr('结尾一句')+colon+fH;t+=vT+' ｜ '+pT+' ｜ '+tr('结尾一句')+colon+fT;}
    else{h+=pH+' ｜ '+fH;t+=pT+' ｜ '+fT;if(a.extra){const x=v(id+'_extra');h+=' ｜ '+tr('加')+colon+(x?esc(x):'<span class="m">—</span>');t+=' ｜ '+tr('加')+colon+(x||'—');}}
    document.getElementById('ac_'+id).classList.toggle('on',!!p&&!!f&&(!a.venue||!!pick(id+'_venue')));L(h,t);
  });
  const adds=COMMON.adds.filter(([k])=>v('add_'+k)||v('add_'+k+'_t')).map(([k,label])=>{const value=v('add_'+k+'_t');return tr(label.replace('，名字',''))+(value?'「'+value+'」':'');}).join(comma);
  const extras=[['加项',adds],['禁忌',v('avoid')],['换幕',v('swap')]];
  L(extras.map(([label,value])=>tr(label)+colon+(value?esc(value):'<span class="m">—</span>')).join('　　'),extras.map(([label,value])=>tr(label)+colon+(value||'—')).join('　　'));
  const mu=radio('music'),muT=mu==='自带'?tr('自带纯音乐')+(v('music_own_t')?'「'+v('music_own_t')+'」':tr('（曲名待补）')):tr('制作方定制');
  L(tr('音乐')+colon+esc(muT),tr('音乐')+colon+muT);
  const [nH,nT]=cell(v('notes'),'备注');L(tr('备注')+colon+nH,tr('备注')+colon+nT);
  L('<span class="m">'+tr('旁白：第三人称讲述（固定）')+'</span>',tr('旁白：第三人称讲述（固定）'));
  /* 必答格数：题材 1 + 基本信息 5 + 五幕（venue 幕 3 格，其余 2 格）+ 备注 1 */
  const total=1+5+T.acts.reduce((s,a)=>s+(a.venue?3:2),0)+1+(needMode()?1:0);
  finishBuild(total,need,html,text);
}

/* ============ 草稿 ============ */
const KEY='story-intake-v2';
function fields(){ const o={}; document.querySelectorAll('main input,main textarea').forEach(el=>{ if(!el.id) return; o[el.id]= (el.type==='checkbox'||el.type==='radio') ? el.checked : el.value; }); return o; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({t:themeKey,f:fields()})); }catch(e){ $('#submitTip').textContent=tr('当前浏览器不能保存草稿，请填好后及时复制，照片原图另发。'); } }
function load(){ try{ const o=JSON.parse(localStorage.getItem(KEY)||'null'); if(!o)return; if(o.t&&THEMES[o.t]){renderTheme(o.t);setRadio('theme',o.t);} Object.keys(o.f||{}).forEach(id=>{ const el=document.getElementById(id);if(!el)return;if(el.type==='checkbox'||el.type==='radio')el.checked=!!o.f[id];else el.value=o.f[id]; }); }catch(e){} }
function reset(){ themeKey=null; document.title=tr('故事采集卡'); $('#appTitle').textContent=tr('故事采集卡'); $('#themeBody').hidden=true; $('#themeBody').innerHTML=''; $('#actChips').innerHTML=''; document.querySelectorAll('input[name="theme"]').forEach(r=>r.checked=false); $('#copyFallback').hidden=true; const u=new URL(location.href);u.searchParams.delete('theme');history.replaceState(null,'',u); }

/* ============ 事件 ============ */
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2400); }
async function copyCard(){
  build();
  if(build.need.length){ toast(tr('请补充：')+build.need.join(comma)+tr('。没有或记不清可如实填写。')); return; }
  const t=build.text;
  try{ await navigator.clipboard.writeText(t);toast(tr('已复制，把故事卡和原图通过微信发回制作方')); }
  catch(e){ const el=$('#copyFallback');el.value=t;el.hidden=false;el.focus();el.select();el.setSelectionRange(0,t.length);toast(tr('请长按文字全选复制，电脑也可按 Ctrl / ⌘ + C')); }
}
/* 渲染防抖：连续输入只触发一次 build；save 保持同步，复制与刷新前不落盘的风险不变 */
let bt;function scheduleBuild(){clearTimeout(bt);bt=setTimeout(build,120);}
document.addEventListener('input', e=>{if(e.target.id==='copyFallback')return;$('#copyFallback').hidden=true;save();scheduleBuild();});
document.addEventListener('change', e=>{
  if(e.target.name==='theme'){
    /* 切换题材：保留草稿，重渲染新题材（旧字段不迁移） */
    renderTheme(e.target.value);
    const url=new URL(location.href);url.searchParams.set('theme',e.target.value);history.replaceState(null,'',url);
    translateStatic();save();
  }
  /* 画风选了非写实项时立即展开第二问，不等防抖渲染 */
  if(e.target.name==='style'){const r=radio('style');$('#styleSub').hidden=!(r&&r!=='写实电影感');}
  save();scheduleBuild();
});
$('#btnCopy').addEventListener('click',copyCard);
$('#btnClear').addEventListener('click',()=>{if(!confirm(tr('清空本机这份填写草稿？')))return;reset();try{localStorage.removeItem(KEY);}catch(e){}build();toast(tr('已清空'));});

/* ============ 翻译与初始化 ============ */
function translateStatic(){
 document.documentElement.lang=LANG==='en'?'en':'zh-CN';document.title=tr(document.title);
 if(LANG==='en'){
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while(n=walker.nextNode()){if(n.parentElement.closest('script,style,#cardBody,#langToggle'))continue;const key=n.textContent.trim();if(EN[key])n.textContent=n.textContent.replace(key,EN[key]);}
  document.querySelectorAll('[placeholder],[aria-label]').forEach(el=>{for(const a of ['placeholder','aria-label'])if(el.hasAttribute(a))el.setAttribute(a,tr(el.getAttribute(a)));});
 }
 const link=$('#langToggle');link.textContent=LANG==='en'?'中文':'English';const url=new URL(location.href);url.searchParams.set('lang',LANG==='en'?'zh':'en');link.href=url.href;
}

/* build 收尾：渲染故事卡与进度（独立函数供两条路径复用） */
function finishBuild(total,need,html,text){
  $('#cardBody').innerHTML=html.join('\n');build.text=text.join('\n');build.need=need;
  const n=Math.max(0,total-need.length);
  $('#fill').style.width=(n/total*100)+'%';$('#progt').textContent=tr('必答')+' '+n+' / '+total+(need.length===0?' · '+tr('可以复制'):'');
  $('#prog').classList.toggle('done',need.length===0);
}

load();
if(!themeKey){const q=new URL(location.href).searchParams.get('theme');if(q&&THEMES[q]){renderTheme(q);setRadio('theme',q);}}
translateStatic();
build();
})();
</script>
</body>
